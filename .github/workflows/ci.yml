name: CI

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

env:
  SHOULD_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate
      - run: npm test
      - name: Validate site skills
        run: npm run validate:site-skills
      - name: Check plugin style and tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          package/ego-browser/node_modules/.bin/prettier --check "plugins/**/*.{mjs,js,json,md}"
          npm --prefix plugins/ego test
      - name: Archive release payload
        if: env.SHOULD_RELEASE == 'true' && matrix.os == 'ubuntu-latest'
        run: tar -czf dist/ego-browser-release-payload.tar.gz -C dist/out .
      - uses: actions/upload-artifact@v4
        if: env.SHOULD_RELEASE == 'true' && matrix.os == 'ubuntu-latest'
        with:
          name: ego-browser-release-payload
          path: package/ego-browser/dist/ego-browser-release-payload.tar.gz

  docker:
    name: Docker build and CLI smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build headless image
        run: docker build --tag ego-lite-headless:ci .
      - name: Run MCP initialize smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | docker run --rm -i ego-lite-headless:ci
      - name: Run bundled CLI help
        run: docker run --rm --entrypoint node ego-lite-headless:ci package/ego-browser/dist/out/index.js --help

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: package/ego-browser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ego-browser-release-payload
          path: package/ego-browser/dist
      - name: Extract release payload
        run: |
          mkdir -p dist/out
          tar -xzf dist/ego-browser-release-payload.tar.gz -C dist/out
      - name: Resolve release channel
        id: release
        run: |
          ref_name="${GITHUB_REF_NAME}"
          supported="true"
          previous_tag=""

          if [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            release_tag="$ref_name"
            prerelease="true"
            latest="false"
            previous_tag="$(git tag --merged HEAD --sort=-creatordate --list 'v*.*.*-beta.*' | grep -v "^$release_tag$" | head -1 || true)"
          elif [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_tag="$ref_name"
            prerelease="false"
            latest="true"
            previous_tag="$(git tag --merged HEAD --sort=-creatordate --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$release_tag$" | head -1 || true)"
          else
            echo "Unsupported release ref: $ref_name"
            supported="false"
          fi

          {
            echo "supported=$supported"
            echo "release_tag=$release_tag"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Package release payload
        if: steps.release.outputs.supported == 'true'
        run: |
          release_tag="${{ steps.release.outputs.release_tag }}"
          cd dist/out
          zip -r "../ego-browser-${release_tag}.zip" .
      - name: Create release
        if: steps.release.outputs.supported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"

          release_tag="${{ steps.release.outputs.release_tag }}"
          prerelease="${{ steps.release.outputs.prerelease }}"
          latest="${{ steps.release.outputs.latest }}"
          previous_tag="${{ steps.release.outputs.previous_tag }}"
          commit_sha="$(git rev-parse HEAD)"
          artifact="package/ego-browser/dist/ego-browser-${release_tag}.zip"
          notes_file="$(mktemp)"
          release_args=()
          notes_args=()

          if [ "$prerelease" = "false" ] && ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "Stable release tags must point to commits reachable from main."
            exit 1
          fi

          if [ "$prerelease" = "true" ]; then
            release_args+=(--prerelease)
          fi

          if [[ "$release_tag" == v*.*.*-beta.* ]]; then
            release_args+=(--draft)
          fi

          if [ "$latest" = "true" ]; then
            release_args+=(--latest)
          else
            release_args+=(--latest=false)
          fi

          if [ -n "$previous_tag" ]; then
            notes_args+=(-f "previous_tag_name=$previous_tag")
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$release_tag" \
            -f target_commitish="$commit_sha" \
            "${notes_args[@]}" \
            --jq .body > "$notes_file"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --title "$release_tag" \
              --notes-file "$notes_file" \
              "${release_args[@]}"
            gh release upload "$release_tag" "$artifact" --clobber
          else
            gh release create "$release_tag" \
              --title "$release_tag" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${release_args[@]}" \
              "$artifact"
          fi
